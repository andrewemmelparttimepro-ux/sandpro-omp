<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-omp-v3.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/sandpro-omp-apple-touch-icon-v3.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff7f02" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ff7f02" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ff7f02" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SandPro" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="SandPro OMP — Enterprise Objective Management Platform for strategic alignment and execution tracking." />
    <meta property="og:title" content="SandPro OMP" />
    <meta property="og:description" content="Enterprise Objective Management Platform for organizational alignment and strategic execution." />
    <meta property="og:type" content="website" />
    <title>SandPro OMP</title>
  </head>
  <body>
    <!-- Item 12: a skeleton in the FIRST paint — HTML arrives long before the
         bundle on LTE, so the app looks alive in under 100ms. React replaces
         this the moment it mounts. -->
    <div id="root"><div style="min-height:100vh;background:#f6f5f2;">
      <div style="height:56px;background:#fff;border-bottom:1px solid #e8e6e1;display:flex;align-items:center;padding:0 18px;">
        <div style="width:112px;height:26px;border-radius:8px;background:linear-gradient(90deg,#ece9e3 25%,#f6f4ef 50%,#ece9e3 75%);background-size:200% 100%;animation:omp-shimmer 1.2s linear infinite;"></div>
      </div>
      <div style="max-width:1180px;margin:18px auto 0;padding:0 16px;">
        <div style="display:flex;gap:10px;margin-bottom:16px;">
          <div style="flex:1;height:120px;border-radius:14px;background:linear-gradient(90deg,#efede8 25%,#f8f6f2 50%,#efede8 75%);background-size:200% 100%;animation:omp-shimmer 1.2s linear infinite;"></div>
          <div style="flex:1;height:120px;border-radius:14px;background:linear-gradient(90deg,#efede8 25%,#f8f6f2 50%,#efede8 75%);background-size:200% 100%;animation:omp-shimmer 1.2s linear infinite;"></div>
          <div style="flex:1;height:120px;border-radius:14px;background:linear-gradient(90deg,#efede8 25%,#f8f6f2 50%,#efede8 75%);background-size:200% 100%;animation:omp-shimmer 1.2s linear infinite;"></div>
        </div>
        <div style="height:14px;width:180px;border-radius:6px;margin-bottom:12px;background:#ece9e3;"></div>
        <div style="height:52px;border-radius:10px;margin-bottom:8px;background:linear-gradient(90deg,#f0eee9 25%,#faf8f4 50%,#f0eee9 75%);background-size:200% 100%;animation:omp-shimmer 1.2s linear infinite;"></div>
        <div style="height:52px;border-radius:10px;margin-bottom:8px;background:linear-gradient(90deg,#f0eee9 25%,#faf8f4 50%,#f0eee9 75%);background-size:200% 100%;animation:omp-shimmer 1.2s linear infinite;"></div>
        <div style="height:52px;border-radius:10px;margin-bottom:8px;background:linear-gradient(90deg,#f0eee9 25%,#faf8f4 50%,#f0eee9 75%);background-size:200% 100%;animation:omp-shimmer 1.2s linear infinite;"></div>
        <div style="height:52px;border-radius:10px;margin-bottom:8px;background:linear-gradient(90deg,#f0eee9 25%,#faf8f4 50%,#f0eee9 75%);background-size:200% 100%;animation:omp-shimmer 1.2s linear infinite;"></div>
      </div>
      <style>@keyframes omp-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}</style>
    </div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
